<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>対数を使って求めてみよう</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f3f6f9;color:#111;font-family:"Yu Gothic","Meiryo",sans-serif}.lesson{max-width:1050px;margin:auto;padding:20px;background:#fff;border:1px solid #d7dee7;border-radius:12px;box-shadow:0 4px 14px #0001}.title{margin-bottom:20px;color:#17365d;font-size:22px;font-weight:700}.flow{display:flex;align-items:center;justify-content:center;gap:12px}.math,.formula{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:normal;font-size:clamp(18px,2.4vw,28px);white-space:nowrap}.math-x{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:normal;font-weight:400}sub,sup{font-size:58%}.arrow{color:#2f75b5;font-size:30px;font-weight:700}.blank{min-width:145px;padding:12px 15px;border:1px dashed #aeb8c2;border-radius:7px;color:transparent;text-align:center;transition:.25s}.blank.show{color:#111;transform:scale(1.02)}.orange{background:#fce4d6}.blue{background:#ddebf7}.yellow{background:#fff2cc}.property{padding:10px 18px;border:2px solid #2f75b5;border-radius:8px;background:#f3f9fd;text-align:center}.property-title{color:#246a9c;font-size:13px;font-weight:700}.property-formula{margin-top:5px;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:clamp(17px,2vw,23px);white-space:nowrap}.divider{height:1px;margin:21px 0 12px;background:#d9e2ec}.row-title{margin-bottom:7px;color:#2f75b5;font-size:13px;font-weight:700}.move-area{flex:0 0 175px;text-align:center}.stage{position:relative;width:170px;height:90px;margin:auto;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif}.base{position:absolute;top:54px;left:72px;font-size:23px;white-space:nowrap}.source-x,.destination-x,.moving-x{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif!important;font-style:normal!important;font-weight:400;color:#c00000;font-variant-numeric:lining-nums;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased}.destination-x{position:absolute;top:54px;left:21px;font-size:23px;opacity:.22}.moving-x{position:absolute;top:41px;left:144px;z-index:5;font-size:20px;line-height:1;opacity:0;will-change:transform,opacity;transform:translate3d(0,0,0) scale(.94);transform-origin:center;backface-visibility:hidden;perspective:1000px;contain:layout paint style}.curve{position:absolute;top:2px;left:10px;width:150px;height:75px;overflow:visible}.path{fill:none;stroke:#2f75b5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#2f75b5}.stage.animate .source-x{opacity:0}.stage.animate .moving-x{opacity:1;animation:move-x 2.15s linear forwards}.stage.animate .destination-x{animation:hide-guide .24s 1.88s forwards}@keyframes move-x{
0%{transform:translate3d(0,0,0) scale(.94)}
5%{transform:translate3d(-1.5px,-4px,0) scale(.95)}
10%{transform:translate3d(-4px,-9px,0) scale(.97)}
15%{transform:translate3d(-8px,-14px,0) scale(.99)}
20%{transform:translate3d(-13px,-19px,0) scale(1.01)}
25%{transform:translate3d(-20px,-24px,0) scale(1.03)}
30%{transform:translate3d(-28px,-29px,0) scale(1.05)}
35%{transform:translate3d(-37px,-33px,0) scale(1.07)}
40%{transform:translate3d(-47px,-36px,0) scale(1.085)}
45%{transform:translate3d(-57px,-38px,0) scale(1.095)}
50%{transform:translate3d(-67px,-39px,0) scale(1.10)}
55%{transform:translate3d(-77px,-38px,0) scale(1.095)}
60%{transform:translate3d(-87px,-35px,0) scale(1.085)}
65%{transform:translate3d(-96px,-31px,0) scale(1.07)}
70%{transform:translate3d(-104px,-26px,0) scale(1.055)}
75%{transform:translate3d(-111px,-20px,0) scale(1.04)}
80%{transform:translate3d(-116px,-13px,0) scale(1.025)}
85%{transform:translate3d(-120px,-6px,0) scale(1.015)}
90%{transform:translate3d(-122px,1px,0) scale(1.008)}
95%{transform:translate3d(-123px,8px,0) scale(1.003)}
100%{transform:translate3d(-123px,13px,0) scale(1)}
}
@keyframes hide-guide{to{opacity:0}}.caption{color:#c00000;font-size:11px;font-weight:700}.fraction{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1}.top{padding:0 5px 4px;border-bottom:1.5px solid}.bottom{padding:4px 5px 0}.explanation{min-height:52px;margin-top:18px;padding:11px 14px;border-left:4px solid #2f75b5;border-radius:4px;background:#f4f8fb;font-size:14px;line-height:1.7}.final-answer{display:none;margin-top:18px;padding:14px 18px;border:2px solid #55a847;border-radius:8px;background:#f3faef;text-align:center;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:clamp(20px,2.7vw,30px);font-weight:700;color:#17365d}.final-answer.show{display:block;animation:answer-in .35s ease-out}.answer-label{margin-right:10px;font-family:"Yu Gothic","Meiryo",sans-serif;font-size:16px;color:#357a2b}@keyframes answer-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.controls{display:flex;gap:10px;margin-top:13px}button{padding:10px 17px;border:0;border-radius:6px;background:#397fc0;color:#fff;font:14px "Yu Gothic","Meiryo",sans-serif;cursor:pointer}button:disabled{background:#9ca3af}@media(max-width:700px){.flow{flex-wrap:wrap}.formula{font-size:17px}.blank{min-width:110px}.arrow{font-size:23px}}@media(prefers-reduced-motion:reduce){.stage.animate .moving-x{animation:none;transform:translate3d(-123px,13px,0) scale(1)}.stage.animate .destination-x{opacity:0;animation:none}}
</style>
</head>
<body><main class="lesson">
<div class="title">対数を使って求めてみよう</div>
<section class="flow">
<div class="formula">log<sub>4</sub>8 = <span class="math-x">𝑥</span></div><div class="arrow">→</div>
<div class="formula blank orange" data-reveal>4<sup><span class="math-x">𝑥</span></sup> = 8</div><div class="arrow">→</div>
<div class="formula blank blue" data-reveal>log<sub>2</sub>4<sup><span class="math-x">𝑥</span></sup> = log<sub>2</sub>8</div><div class="arrow">→</div>
<div class="property"><div class="property-title">対数の性質</div><div class="property-formula">log<sub>a</sub>M<sup>n</sup> = n log<sub>a</sub>M</div></div>
</section>
<div class="divider"></div><div class="row-title">対数の性質を使って変形する</div>
<section class="flow">
<div class="move-area"><div class="stage" id="stage"><svg class="curve" viewBox="0 0 150 75" aria-hidden="true"><path class="path" d="M138 57 C138 18,101 1,67 8 C37 14,22 35,22 55"></path><path class="tip" d="M22 63 L13 49 L30 53 Z"></path></svg><span class="destination-x">𝑥</span><span class="base">log<sub>2</sub>4<sup class="source-x">𝑥</sup></span><span class="moving-x">𝑥</span></div><div class="caption">指数の <span class="math-x">𝑥</span> を前に出す</div></div><div class="arrow">→</div>
<div class="formula blank yellow" data-reveal><span class="math-x">𝑥</span> log<sub>2</sub>4 = log<sub>2</sub>8</div><div class="arrow">→</div>
<div class="formula blank yellow" data-reveal><span class="math-x">𝑥</span> = <span class="fraction"><span class="top">log<sub>2</sub>8</span><span class="bottom">log<sub>2</sub>4</span></span></div>
</section>
<div class="explanation" id="explanation" aria-live="polite">「穴埋めする」を押すと、左から右へ1つずつ進みます。</div>
<div class="final-answer" id="answer" aria-live="polite"><span class="answer-label">答え</span>log<sub>4</sub>8 = <span class="fraction"><span class="top">log<sub>2</sub>8</span><span class="bottom">log<sub>2</sub>4</span></span> = <span class="fraction"><span class="top">3</span><span class="bottom">2</span></span></div>
<div class="controls"><button type="button" id="next">穴埋めする →</button><button type="button" id="reset">最初から</button></div>
</main>
<script>(()=>{const blanks=[...document.querySelectorAll('[data-reveal]')],stage=document.querySelector('#stage'),next=document.querySelector('#next'),reset=document.querySelector('#reset'),ex=document.querySelector('#explanation'),answer=document.querySelector('#answer');let step=0;const messages=['対数の定義から、log₄8 = 𝑥 を 4ˣ = 8 に直します。','4ˣ = 8 の両辺に底2の対数をとります。','四角で囲んだ対数の性質を使います。次は2段目に進みます。','指数の 𝑥 が曲線矢印に沿って log₂4 の前へ移動します。','𝑥 log₂4 = log₂8 となります。','両辺を log₂4 で割ります。最後に答えを確認しましょう。'];function advance(){if(step===0)blanks[0].classList.add('show');else if(step===1)blanks[1].classList.add('show');else if(step===2){}else if(step===3){stage.classList.remove('animate');void stage.offsetWidth;stage.classList.add('animate')}else if(step===4)blanks[2].classList.add('show');else if(step===5){blanks[3].classList.add('show');answer.classList.add('show')}else return;ex.textContent=messages[step++];if(step===6)next.disabled=true}function restart(){step=0;blanks.forEach(b=>b.classList.remove('show'));stage.classList.remove('animate');answer.classList.remove('show');next.disabled=false;ex.textContent='「穴埋めする」を押すと、左から右へ1つずつ進みます。'}next.addEventListener('click',advance);reset.addEventListener('click',restart)})();</script>
</body></html>
