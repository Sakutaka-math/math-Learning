<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>対数を使って求めてみよう</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:20px;background:#f3f6f9;color:#111;font-family:"Yu Gothic","Meiryo",sans-serif}
    .lesson{width:min(100%,1050px);margin:0 auto;padding:20px;background:#fff;border:1px solid #d7dee7;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
    .title{margin-bottom:20px;color:#17365d;font-size:22px;font-weight:700}
    .flow{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
    .formula{font-family:"Times New Roman",serif;font-size:clamp(18px,2.4vw,28px);white-space:nowrap}
    sub,sup{font-size:58%}
    .next-arrow{flex:0 0 auto;color:#2f75b5;font-size:30px;font-weight:700}
    .blank{min-width:145px;padding:12px 15px;border:1px dashed #aeb8c2;border-radius:7px;color:transparent;text-align:center;transition:color .25s,border-color .25s,transform .25s}
    .blank.show{color:#111;border-color:rgba(47,117,181,.5);transform:scale(1.02)}
    .orange{background:#fce4d6}.blue{background:#ddebf7}.yellow{background:#fff2cc}
    .property{padding:10px 18px;border:2px solid #2f75b5;border-radius:8px;background:#f3f9fd;text-align:center}
    .property-title{margin-bottom:5px;color:#246a9c;font-size:13px;font-weight:700}
    .property-formula{font-family:"Times New Roman",serif;font-size:clamp(17px,2vw,23px);white-space:nowrap}
    .divider{height:1px;margin:21px 0 12px;background:#d9e2ec}
    .second-row-title{margin-bottom:7px;color:#2f75b5;font-size:13px;font-weight:700}
    .move-area{flex:0 0 175px;text-align:center}
    .move-stage{position:relative;width:170px;height:90px;margin:0 auto;font-family:"Times New Roman",serif}
    .base-formula{position:absolute;top:54px;left:72px;font-size:23px;white-space:nowrap}
    .source-x{color:#c00000;font-weight:700}
    .destination-x{position:absolute;top:54px;left:21px;z-index:2;color:#c00000;font-size:23px;font-weight:700;opacity:.22}
    .moving-x{position:absolute;top:41px;left:144px;z-index:5;color:#c00000;font-size:20px;font-weight:700;opacity:0}
    .curve-arrow{position:absolute;top:2px;left:10px;width:150px;height:75px;overflow:visible;pointer-events:none}
    .arrow-path{fill:none;stroke:#2f75b5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .arrow-head{fill:#2f75b5}
    .move-stage.animate .source-x{opacity:0}
    .move-stage.animate .moving-x{opacity:1;animation:move-x 1.5s cubic-bezier(.42,.08,.2,1) forwards}
    .move-stage.animate .destination-x{animation:hide-guide .15s 1.35s forwards}
    @keyframes move-x{0%{top:41px;left:144px;transform:scale(.9)}22%{top:13px;left:124px;transform:scale(1)}50%{top:1px;left:82px;transform:scale(1.15)}78%{top:24px;left:40px;transform:scale(1.05)}100%{top:54px;left:21px;transform:scale(1)}}
    @keyframes hide-guide{to{opacity:0}}
    .move-caption{margin-top:1px;color:#c00000;font-size:11px;font-weight:700;white-space:nowrap}
    .fraction{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1}
    .fraction-top{padding:0 5px 4px;border-bottom:1.5px solid currentColor}.fraction-bottom{padding:4px 5px 0}
    .explanation{min-height:52px;margin-top:18px;padding:11px 14px;border-left:4px solid #2f75b5;border-radius:4px;background:#f4f8fb;font-size:14px;line-height:1.7}
    .controls{display:flex;gap:10px;margin-top:13px}
    button{padding:10px 17px;border:0;border-radius:6px;background:#397fc0;color:#fff;font-family:inherit;font-size:14px;cursor:pointer}
    button:hover:not(:disabled){background:#286ba8}button:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}button:disabled{background:#9ca3af;cursor:default}
    @media(max-width:850px){.lesson{padding:14px}.flow{gap:6px}.formula{font-size:clamp(14px,2.2vw,20px)}.blank{min-width:105px;padding:9px 7px}.property{padding:7px 9px}.property-formula{font-size:clamp(14px,1.8vw,18px)}.move-area{flex-basis:145px;transform:scale(.88);margin:-8px}.next-arrow{font-size:23px}}
    @media(max-width:620px){.flow{flex-wrap:wrap}.next-arrow{font-size:22px}.title{font-size:18px}.second-row-title{text-align:center}}
    @media(prefers-reduced-motion:reduce){.move-stage.animate .moving-x{top:54px;left:21px;animation:none}.move-stage.animate .destination-x{opacity:0;animation:none}}
    @media(prefers-color-scheme:dark){body{background:#111827}.lesson{background:#1d1d1d;color:#eee;border-color:#555}.property{background:#27343d}.explanation{background:#293038}.divider{background:#52606d}.blank.show{color:#eee}}
  </style>
</head>
<body>
  <main class="lesson">
    <div class="title">対数を使って求めてみよう</div>
    <section class="flow" aria-label="1段目">
      <div class="formula">log<sub>4</sub> 8 = x</div><div class="next-arrow">→</div>
      <div class="formula blank orange" data-reveal>4<sup>x</sup> = 8</div><div class="next-arrow">→</div>
      <div class="formula blank blue" data-reveal>log<sub>2</sub>4<sup>x</sup> = log<sub>2</sub>8</div><div class="next-arrow">→</div>
      <div class="property"><div class="property-title">対数の性質</div><div class="property-formula">log<sub>a</sub>M<sup>n</sup> = n log<sub>a</sub>M</div></div>
    </section>
    <div class="divider"></div>
    <div class="second-row-title">対数の性質を使って変形する</div>
    <section class="flow" aria-label="2段目">
      <div class="move-area">
        <div class="move-stage" id="move-stage">
          <svg class="curve-arrow" viewBox="0 0 150 75" aria-hidden="true">
            <path class="arrow-path" d="M138 57 C138 18,101 1,67 8 C37 14,22 35,22 55"></path>
            <path class="arrow-head" d="M22 63 L13 49 L30 53 Z"></path>
          </svg>
          <span class="destination-x">x</span>
          <span class="base-formula">log<sub>2</sub>4<sup class="source-x">x</sup></span>
          <span class="moving-x">x</span>
        </div>
        <div class="move-caption">指数の x を前に出す</div>
      </div>
      <div class="next-arrow">→</div>
      <div class="formula blank yellow" data-reveal>x log<sub>2</sub>4 = log<sub>2</sub>8</div>
      <div class="next-arrow">→</div>
      <div class="formula blank yellow" data-reveal>x = <span class="fraction"><span class="fraction-top">log<sub>2</sub>8</span><span class="fraction-bottom">log<sub>2</sub>4</span></span></div>
    </section>
    <div class="explanation" id="explanation" aria-live="polite">「穴埋めする」を押すと、左から右へ1つずつ進みます。「対数の性質」の次から2段目に移り、指数の x が前へ移動します。</div>
    <div class="controls"><button type="button" id="next-button">穴埋めする →</button><button type="button" id="reset-button">最初から</button></div>
  </main>
  <script>
    (()=>{
      const lesson=document.querySelector('.lesson');
      const blanks=[...lesson.querySelectorAll('[data-reveal]')];
      const moveStage=document.querySelector('#move-stage');
      const nextButton=document.querySelector('#next-button');
      const resetButton=document.querySelector('#reset-button');
      const explanation=document.querySelector('#explanation');
      let step=0;
      const explanations=[
        '対数の定義から、log₄8 = x を 4ˣ = 8 に直します。',
        '4ˣ = 8 の両辺に、底2の対数をとります。すると、log₂4ˣ = log₂8 となります。',
        'ここで、四角で囲んだ対数の性質「logₐMⁿ = n logₐM」を使います。次は2段目に進みます。',
        '指数の x が青い曲線矢印に沿って移動し、log₂4 の前に出ます。矢印の先端は移動先の x を指しています。',
        '対数の性質を使うと、x log₂4 = log₂8 となります。',
        '両辺を log₂4 で割ると、x = log₂8 ÷ log₂4 となります。'
      ];
      function advance(){
        if(step===0)blanks[0].classList.add('show');
        else if(step===1)blanks[1].classList.add('show');
        else if(step===2){}
        else if(step===3){moveStage.classList.remove('animate');void moveStage.offsetWidth;moveStage.classList.add('animate')}
        else if(step===4)blanks[2].classList.add('show');
        else if(step===5)blanks[3].classList.add('show');
        else return;
        explanation.textContent=explanations[step];step+=1;
        if(step===explanations.length)nextButton.disabled=true;
      }
      function reset(){step=0;blanks.forEach(b=>b.classList.remove('show'));moveStage.classList.remove('animate');nextButton.disabled=false;explanation.textContent='「穴埋めする」を押すと、左から右へ1つずつ進みます。「対数の性質」の次から2段目に移り、指数の x が前へ移動します。'}
      nextButton.addEventListener('click',advance);resetButton.addEventListener('click',reset);
    })();
  </script>
</body>
</html>
